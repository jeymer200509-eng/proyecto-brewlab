name: Verify BrewLab
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Domain tests and WAR
        run: mvn -B test package
      - name: Start isolated local server
        run: docker compose up --build -d
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Server, workflows and responsive checks
        run: node e2e/smoke.cjs
      - name: Server logs
        if: always()
        run: docker compose logs --no-color > server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brewlab-verification
          path: |
            target/surefire-reports/
            target/brewlab.war
            test-results/
            server.log
      - name: Stop test server
        if: always()
        run: docker compose down
